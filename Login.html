<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />  
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>  
  <title>Secure Login - AR Love Letters </title>

  <meta name="robots" content="noindex">

  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  
  <script>
    (function() {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <style>  
    :root {  
      --color-bg: #fdf6f0; --color-text: #333; --color-primary: #ff6f61;  
      --color-primary-hover: #e85c50; --color-input-bg: #fff; --color-card: #ffe8e5;  
    }  
    [data-theme="dark"] {
      --color-bg: #1c1c1c; --color-text: #f1f1f1; --color-primary: #ff8a80;
      --color-primary-hover: #ff5252; --color-input-bg: #333; --color-card: #2a2a2a;
    }
    * { margin:0; padding:0; box-sizing:border-box; }  
    body {  
      font-family: 'Montserrat', sans-serif; background: var(--color-bg); color: var(--color-text);  
      min-height:100vh; display:flex; justify-content:center; align-items:center; transition: background 0.3s, color 0.3s;
    }  
    .login-container {  
      width: 90%; max-width: 400px; background: var(--color-input-bg); color: var(--color-text);  
      padding: 40px 30px; border-radius: 15px; text-align: center; box-shadow: 0px 10px 20px rgba(0,0,0,0.15);  
    }  
    .login-container h1 { font-family: 'Playfair Display', serif; font-size:26px; margin-bottom:5px; color: var(--color-primary); }  
    
    /* Trust message */
    .trust-message { font-size: 12px; color: #888; margin-bottom: 25px; }

    .input-group { text-align: left; margin-bottom: 15px; position: relative; }  
    .input-group label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 600; }  
    .login-container input {  
      width: 100%; padding:12px 40px 12px 10px; border:2px solid var(--color-primary);  
      border-radius:5px; font-size:16px; background: var(--color-bg); color: var(--color-text); transition: border 0.3s;  
    }  
    .login-container input:focus { border-color: var(--color-primary-hover); outline:none; }  
    .toggle-password { position: absolute; right: 15px; top: 36px; cursor: pointer; color: #888; font-size: 18px; transition: color 0.3s; }
    .toggle-password:hover { color: var(--color-primary); }
    
    /* Original Login Button Styles */
    .login-container button.btn-login {  
      width:100%; padding:12px; background: var(--color-primary); color:white; border:none;  
      border-radius:50px; font-size:16px; font-weight: 600; cursor:pointer; transition: background 0.3s, transform 0.3s;  
      margin-top: 5px; box-shadow: 0 5px 15px rgba(255, 111, 97, 0.3);
    }  
    .login-container button.btn-login:hover { background: var(--color-primary-hover); transform: translateY(-2px); }  

    /* Google Button Styles */
    .btn-google {
      width: 100%; padding: 12px; background: var(--color-input-bg); color: var(--color-text);
      border: 2px solid #ddd; border-radius: 50px; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: all 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-top: 10px; font-family: 'Montserrat', sans-serif;
    }
    [data-theme="dark"] .btn-google { border-color: #555; }
    .btn-google:hover { border-color: var(--color-primary); transform: translateY(-2px); }

    .divider { display: flex; align-items: center; margin: 20px 0 10px 0; }
    .divider hr { flex: 1; border: none; border-top: 1px solid #ddd; }
    [data-theme="dark"] .divider hr { border-top-color: #444; }
    .divider span { padding: 0 10px; color: #888; font-size: 12px; font-weight: 600; }

    .login-container p { margin-top:15px; font-size:14px; }  
    .login-container a { color: var(--color-primary); text-decoration:none; transition: color 0.3s; font-weight: 600; }  
    .login-container a:hover { color: var(--color-primary-hover); text-decoration: underline; }  
    .error-message { color: #ff4e50; margin-top: 10px; font-size: 14px; font-weight: 600; }
    .forgot-pass { text-align: right; font-size: 13px; margin-top: 8px; }
    @media(max-width:480px){ .login-container{ width:90%; padding:25px; } }  
  </style>
</head>

<body>
  <div class="login-container">
    <h1 style="font-size: 26px;">Welcome back to AR Love Letters</h1>
    
    <div class="trust-message"><i class="fa-solid fa-shield-halved"></i> Securely login powered by Firebase Authentication.</div>
    
    <form id="loginForm" action="#" method="POST">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <i class="fa-solid fa-eye toggle-password" id="togglePass"></i>
        
        <div class="forgot-pass">
            <a href="#" id="forgotPassword">Forgot Password?</a>
        </div>
      </div>

      <button type="submit" class="btn-login">Login</button>
      <p id="error-message" class="error-message"></p>
    </form>

    <div class="divider">
        <hr><span>OR</span><hr>
    </div>

    <button type="button" id="googleLoginBtn" class="btn-google">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo" style="width: 20px;">
        Continue with Google
    </button>

    <p>Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>

  <script type="module">
    // ✨ Clean Import from Central Module
    import { initFirebase } from "./firebase-init.js";
    // ✨ Added Google Auth imports
    import { signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";

    function setupPasswordToggle(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input && icon) {
            icon.addEventListener("click", function () {
                if (input.type === "password") {
                    input.type = "text";
                    icon.classList.remove("fa-eye");
                    icon.classList.add("fa-eye-slash");
                } else {
                    input.type = "password";
                    icon.classList.remove("fa-eye-slash");
                    icon.classList.add("fa-eye");
                }
            });
        }
    }

    function getCustomErrorMessage(errorCode) {
        const errorMessages = {
            "auth/user-not-found": "⚠️ This email is not registered. Sign up first!",
            "auth/wrong-password": "⚠️ Incorrect password! Try again.",
            "auth/invalid-email": "⚠️ Please enter a valid email address!",
            "auth/user-disabled": "⚠️ This account has been disabled!",
            "auth/missing-password": "⚠️ Please enter your password!",
            "auth/network-request-failed": "⚠️ Network error! Check your connection.",
            "auth/too-many-requests": "⚠️ Too many failed attempts. Try again later!",
            "auth/invalid-login-credentials": "⚠️ Invalid email or password!",
            "auth/popup-closed-by-user": "⚠️ Sign-in cancelled by user."
        };
        return errorMessages[errorCode] || "⚠️ Something went wrong. Please try again.";
    }

    document.addEventListener("DOMContentLoaded", async function () {
        const loginForm = document.getElementById("loginForm");
        const forgotPasswordLink = document.getElementById("forgotPassword");
        const errorBox = document.getElementById("error-message");
        const googleLoginBtn = document.getElementById("googleLoginBtn");

        setupPasswordToggle("password", "togglePass");

        if (!loginForm) return;

        // Initialize Firebase
        const { auth } = await initFirebase();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (user.uid === "uO7ArUSY9FRlBOeNngvJ5TtbVqz1") { 
                    window.location.href = "admin-panel.html";
                } else {
                    window.location.href = "dashboard.html";
                }
            }
        });

        if (forgotPasswordLink) {
            forgotPasswordLink.addEventListener("click", async function (e) {
                e.preventDefault();
                const email = document.getElementById("email").value.trim();

                if (!email) {
                    errorBox.innerHTML = "⚠️ Please enter your email first to reset password!";
                    return;
                }

                errorBox.innerHTML = "Sending reset link...";
                errorBox.style.color = "#888";

                try {
                    await sendPasswordResetEmail(auth, email);
                    errorBox.innerHTML = "✅ Password reset link sent to your email. Please check your spam folder.";
                    errorBox.style.color = "#28a745";
                } catch (error) {
                    let errorMessage = getCustomErrorMessage(error.code);
                    errorBox.innerHTML = `❌ ${errorMessage}`;
                    errorBox.style.color = "#ff4e50";
                }
            });
        }

        // Email/Password Login
        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const loginButton = event.target.querySelector("button.btn-login");

            if (!email || !password) {
                errorBox.innerHTML = "⚠️ Please enter your email and password!";
                return;
            }

            errorBox.innerHTML = "Logging in...";
            errorBox.style.color = "#888";
            loginButton.innerHTML = "Logging in...";
            loginButton.disabled = true;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                errorBox.style.color = "#28a745";
                errorBox.innerHTML = "✅ Login successful! Redirecting...";
            } catch (error) {
                let errorCode = error.code.split("/").pop().trim();
                let errorMessage = getCustomErrorMessage(`auth/${errorCode}`);
                errorBox.style.color = "#ff4e50";
                errorBox.innerHTML = `❌ ${errorMessage}`;
            } finally {
                loginButton.innerHTML = "Login";
                loginButton.disabled = false;
            }
        });

        // Google Sign-In Logic
        if (googleLoginBtn) {
            googleLoginBtn.addEventListener("click", async function () {
                errorBox.innerHTML = "Opening Google Sign-In...";
                errorBox.style.color = "#888";
                
                const provider = new GoogleAuthProvider();
                
                try {
                    await signInWithPopup(auth, provider);
                    errorBox.style.color = "#28a745";
                    errorBox.innerHTML = "✅ Google Login successful! Redirecting...";
                    // Note: onAuthStateChanged will handle the redirect automatically just like normal login
                } catch (error) {
                    console.error("Google Auth Error:", error);
                    let errorCode = error.code || "";
                    let errorMessage = getCustomErrorMessage(errorCode);
                    errorBox.style.color = "#ff4e50";
                    errorBox.innerHTML = `❌ ${errorMessage}`;
                }
            });
        }
    });
  </script>
</body>
</html>
